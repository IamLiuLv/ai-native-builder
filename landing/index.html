<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbf8f1" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>成为 AI Native Builder · 一个人 + AI，从需求到交付的完整闭环</title>
    <meta name="description" content="AI 写得快不稀奇。这本小册讲怎么让它交付的东西，质量过关：AI Native 交付质量三角模型。" />
    <script>
      // Follow the book's light/dark choice before first paint (same key as VitePress).
      (function () {
        var stored = null;
        try { stored = localStorage.getItem("vitepress-theme-appearance"); } catch (e) {}
        var dark = stored === "dark" || (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

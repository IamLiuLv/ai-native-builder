    <!-- PWA shell. The manifest and icons live in public/ so their URLs never
         gain a build hash — /sw.js is registered by fixed path (src/push/) and
         iOS reads apple-touch-icon by convention. theme-color matches the dark
         bg-layout token; the app is installed from its dark, terminal-native
         face, and the status bar should not flash white around it. -->
    <link rel="manifest" href="/rounds/r1-b/manifest.webmanifest" />

    <!--
      Theme, applied before first paint. This is the one real cost of the
      `.dark` class strategy (ADR 0002): the class comes from JS reading
      localStorage, so without this the first frame paints the wrong theme and
      the module bundle below corrects it a moment later — a white flash for
      every dark-mode user, on every load.

      It must stay INLINE and NOT be `type="module"`: a module script is
      deferred, which puts it after first paint and defeats the whole point.
      Vite leaves inline classic scripts in <head> exactly where they are, so
      this survives the build untouched.

      Kept in sync with theme.ts by hand — deliberately duplicated rather than
      imported, because importing anything here would make it a module. The
      storage key is the coupling: "app-theme" in both places.
    -->
    <script>
      (function () {
        try {
          var choice = localStorage.getItem("app-theme");
          var dark =
            choice === "dark" ||
            ((choice === null || choice === "system") &&
              matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          // Storage blocked (private mode / partitioned context). Light is the
          // documented default, and the app corrects itself once it mounts.
        }
      })();
    </script>
